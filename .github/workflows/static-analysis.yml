name: Static Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  phpstan:
    name: PHPStan (PHP 8.5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, openssl, zip, :glfw
          tools: composer:v2

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y php8.5-dev build-essential cmake libglfw3-dev xvfb libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev gdb

      - name: Build php-glfw
        run: |
          git clone https://github.com/mario-deluna/php-glfw
          cd php-glfw
          phpize8.5
          ./configure --enable-glfw --with-php-config="$(command -v php-config8.5)"
          # Link the C++ runtime required by php-glfw's voxel parser.
          make -j"$(nproc)" GLFW_SHARED_LIBADD='-lglfw -lstdc++'
          sudo make install

      - name: Enable and verify php-glfw
        run: |
          echo 'extension=glfw.so' | sudo tee /etc/php/8.5/cli/conf.d/99-glfw.ini
          php --ri glfw

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.5-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyze --memory-limit=1G --error-format=github

