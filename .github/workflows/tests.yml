name: Tests

on:
  push:
    branches: [ main, master, develop ]
    tags: [ "[0-9]*", "v[0-9]*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP 8.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, openssl, zip, :glfw
          tools: composer:v2, phpize, php-config
          coverage: none

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev xvfb libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev gdb

      - name: Build php-glfw
        run: |
          git clone https://github.com/mario-deluna/php-glfw
          cd php-glfw
          phpize
          ./configure --enable-glfw --with-php-config="$(command -v php-config)"
          # Link the C++ runtime required by php-glfw's voxel parser.
          make -j"$(nproc)" GLFW_SHARED_LIBADD='-lglfw -lstdc++'
          sudo make install

      - name: Enable and verify php-glfw
        run: |
          echo 'extension=glfw.so' | sudo tee /etc/php/8.5/cli/conf.d/99-glfw.ini
          php --ri glfw

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Locate Composer download cache
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox
